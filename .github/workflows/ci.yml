name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up Tcl
      run: |
        sudo apt-get update
        sudo apt-get install -y tcl tcl-dev expect
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        cd gateway && pip install -r requirements.txt
    
    - name: Run Tcl tests
      run: |
        cd tests
        tclsh all.tcl
    
    - name: Run Python integrity tests
      run: |
        python3 -m pytest gateway/tests/test_integrity.py -q

    - name: Run main Python suite
      run: |
        python3 -m pytest tests/ gateway/tests/ -q -m "not slow and not selenium and not external"

    - name: Run JavaScript tests
      run: |
        grep -v '^#' scripts/js-tests.manifest | grep -v '^[[:space:]]*$' | xargs node --test

    - name: Run API tests
      run: |
        python3 tests/quick-test-api.py

    - name: Run benchmark suite
      run: |
        tclsh tests/benchmark.tcl
  
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install pylint flake8
    
    - name: Lint Python files
      run: |
        find gateway -name "*.py" -type f | xargs pylint --exit-zero
        find gateway -name "*.py" -type f | xargs flake8 --exit-zero
  
  coverage:
    name: Coverage (gateway)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install coverage tools
      run: |
        python -m pip install --upgrade pip
        pip install coverage pytest
    
    - name: Run gateway tests with coverage
      run: |
        cd gateway
        coverage run -m pytest tests/ -q
        coverage report
        coverage html
    
    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: gateway/htmlcov/

  ui-tests:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Chrome and selenium
      run: |
        # O chromium dos repositórios do runner NÃO fica em /opt/google/chrome:
        # o Selenium Manager procura o binário no caminho padrão do Google
        # Chrome e o job falhava com "no chrome binary at
        # /opt/google/chrome/chrome" (tests/test_web_ui_selenium.py não lê
        # CHROME_BIN — usa webdriver.Chrome() puro, headless). Instala o pacote
        # oficial, que entrega exatamente esse caminho.
        sudo apt-get update
        sudo apt-get install -y wget gnupg
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
          | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
          | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        google-chrome --version
        python -m pip install --upgrade pip
        pip install selenium

    - name: Run Selenium smoke tests
      run: |
        python3 tests/test_web_ui_selenium.py

openapi: "3.0.3"
info:
  title: Dakota Replay - Synthetic API
  description: |
    API completa de geração de massa sintética, jornadas, stress e homologação.
    Todos os comandos CLI têm equivalente REST.
  version: "1.0.0"

servers:
  - url: http://localhost:8090
    description: Replay2 Control Plane (synthetic API)

paths:
  # ── Status ──
  /api/synthetic/status:
    get:
      operationId: getStatus
      summary: Status resumido
      responses:
        "200":
          description: Contagem de screens, entities, datasets, journeys
          content:
            application/json:
              schema:
                type: object
                properties:
                  screens: { type: integer }
                  entities: { type: integer }
                  datasets: { type: integer }
                  journeys: { type: integer }

  # ── Screens ──
  /api/synthetic/screens:
    get:
      operationId: listScreens
      summary: Listar telas descobertas
      responses:
        "200":
          description: Lista de telas com campos
  /api/synthetic/screens/{screen_id}:
    get:
      operationId: getScreen
      summary: Detalhes de uma tela
      parameters:
        - name: screen_id
          in: path
          required: true
          schema: { type: integer }

  # ── Analyze ──
  /api/synthetic/analyze-source:
    post:
      operationId: analyzeSource
      summary: Analisar código-fonte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_dir]
              properties:
                source_dir: { type: string, description: "Diretório com .prg, .sql, etc." }
      responses:
        "200":
          description: Telas e entidades descobertas

  # ── Generate ──
  /api/synthetic/generate:
    post:
      operationId: generateDataset
      summary: Gerar dataset sintético
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screen]
              properties:
                screen: { type: string }
                quantity: { type: integer, default: 100 }
                seed: { type: integer, default: 0 }

  # ── Stress ──
  /api/synthetic/stress:
    post:
      operationId: runStress
      summary: Executar stress sintético (SIMULAÇÃO — telas sintetizadas, sem terminal real)
      description: >
        O stress sintético não executa terminal real: as telas verificadas são
        sintetizadas da definição da jornada. A resposta sempre traz
        `simulation: true` e o resultado NÃO sustenta veredito oficial de
        benchmark nem recomendação de migração.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario: { type: string, description: "Journey ID" }
                concurrency: { type: integer, default: 10 }
                max_sessions: { type: integer }
                seed: { type: integer }
      responses:
        "200":
          description: Resultado da simulação de stress
          content:
            application/json:
              schema:
                type: object
                required: [status, simulation]
                properties:
                  status: { type: string, example: completed }
                  simulation:
                    type: boolean
                    enum: [true]
                    description: Sempre true — resultado é simulação, não medição real
                  total_sessions: { type: integer }
                  completed: { type: integer }
                  failed: { type: integer }
                  errors: { type: integer }
                  duration_ms: { type: integer }

  /api/synthetic/stress/real:
    post:
      operationId: runStressReal
      summary: Executar stress sintético REAL via replay_control (X5 — não é simulação)
      description: >
        Materializa os inputs da jornada como trilha auditável
        (`audit-*.jsonl` com hash-chain + HMAC, verificada pelo `verify_log`
        do Runner) e cria um run real de replay (mesmo pipeline de
        `POST /api/runs`, incluindo resolução de target e compliance
        gateway-only). A resposta traz `simulation: false`: a execução
        acontece contra o target informado via replay_control. O `log_dir`
        é efêmero (`<state>/synthetic_runs/<uuid>/`) e é removido pelo
        Runner ao fim do run (sucesso ou falha).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [journey_id]
              properties:
                journey_id: { type: string, description: "Journey ID (alias: scenario)" }
                scenario: { type: string, description: "Alias de journey_id" }
                mode:
                  type: string
                  enum: [strict-global, parallel-sessions]
                  default: parallel-sessions
                concurrency: { type: integer, default: 10 }
                sessions: { type: integer, description: "Nº de sessões (default: concurrency*5)" }
                seed: { type: integer, default: 0 }
                target_env_id: { type: integer }
                connection_profile_id: { type: integer }
                target_host: { type: string }
                target_user: { type: string }
                target_command: { type: string }
                params: { type: object, description: "Parâmetros extras de replay (match_mode, match_threshold, ...)" }
      responses:
        "202":
          description: Run real criado e enfileirado
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status, simulation]
                properties:
                  run_id: { type: integer }
                  status: { type: string, example: queued }
                  log_dir: { type: string, description: "Trilha efêmera (removida ao fim do run)" }
                  sessions: { type: integer }
                  simulation:
                    type: boolean
                    enum: [false]
                    description: Sempre false — execução real via replay_control
        "400":
          description: Body inválido (journey_id ausente, mode inválido, target inválido)
        "404":
          description: Jornada inexistente

  # ── Datasets ──
  /api/synthetic/datasets:
    get:
      operationId: listDatasets
      summary: Listar datasets gerados
  /api/synthetic/datasets/{dataset_id}:
    get:
      operationId: getDataset
      summary: Detalhes de dataset com amostra
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema: { type: integer }

  # ── Entities ──
  /api/synthetic/entities:
    get:
      operationId: listEntities
      summary: Listar entidades descobertas

  # ── Journeys ──
  /api/synthetic/journeys:
    get:
      operationId: listJourneys
      summary: Listar jornadas
    post:
      operationId: inferJourneysFromSource
      summary: Inferir jornadas do código-fonte
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source_dir: { type: string }

  /api/synthetic/journeys/infer:
    post:
      operationId: inferJourneys
      summary: Inferir e salvar jornadas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_dir]
              properties:
                source_dir: { type: string }

  /api/synthetic/journeys/infer-menu:
    post:
      operationId: inferMenu
      summary: Inferir jornada de arquivo de menu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [menu_file]
              properties:
                menu_file: { type: string }

  /api/synthetic/journeys/{journey_id}:
    get:
      operationId: getJourney
      summary: Detalhes de jornada com passos
      parameters:
        - name: journey_id
          in: path
          required: true
          schema: { type: string }

  /api/synthetic/journeys/{journey_id}/run:
    post:
      operationId: runJourney
      summary: Executar jornada
      parameters:
        - name: journey_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessions: { type: integer, default: 10 }
                seed: { type: integer }
                concurrency: { type: integer }

  /api/synthetic/journeys/{journey_id}/verify:
    get:
      operationId: verifyJourney
      summary: Verificar jornada (sem executar)
      parameters:
        - name: journey_id
          in: path
          required: true
          schema: { type: string }
        - name: sessions
          in: query
          schema: { type: integer, default: 5 }
        - name: seed
          in: query
          schema: { type: integer }

  /api/synthetic/journeys/{journey_id}/report:
    get:
      operationId: getReport
      summary: Relatório de homologação
      parameters:
        - name: journey_id
          in: path
          required: true
          schema: { type: string }
        - name: sessions
          in: query
          schema: { type: integer }
        - name: format
          in: query
          schema: { type: string, enum: [json, html], default: json }

  # ── Error Patterns ──
  /api/synthetic/error-patterns:
    get:
      operationId: getErrorPatterns
      summary: Catálogo de padrões de erro

  # ── Screen Diff ──
  /api/synthetic/diff:
    get:
      operationId: screenDiff
      summary: Diff visual entre duas telas
      parameters:
        - name: expected
          in: query
          required: true
          schema: { type: string }
        - name: observed
          in: query
          required: true
          schema: { type: string }

  # ── Quickstart ──
  /api/synthetic/quickstart:
    post:
      operationId: quickstart
      summary: Pipeline completo (analyze→infer→stress→report→junit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_dir]
              properties:
                source_dir: { type: string }
                concurrency: { type: integer }
                sessions: { type: integer }
